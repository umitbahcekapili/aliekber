                    <button onclick="scrollToCategory('${cat.id}', this)" class="tab-btn whitespace-nowrap px-3.5 py-1.5 rounded-full text-xs transition flex items-center gap-1.5 ${activeClass}">
                        <i class="fa-solid ${cat.icon} text-xs"></i>
                        <span>${cat.title}</span>
                    </button>
                `;
            });
            
            tabsContainer.innerHTML = html;
        }

        // RENDER ALL MENU ITEMS
        function renderMenu(filterText = '') {
            const menuContainer = document.getElementById('menuContainer');
            const noResults = document.getElementById('noResults');
            let hasResults = false;
            let html = '';

            menuData.forEach(cat => {
                // Filter items if searching
                const filteredItems = cat.items.filter(item => 
                    item.name.toLowerCase().includes(filterText.toLowerCase()) || 
                    item.desc.toLowerCase().includes(filterText.toLowerCase())
                );

                if (filteredItems.length > 0) {
                    hasResults = true;
                    html += `
                        <section id="${cat.id}" class="scroll-mt-24">
                            <!-- Category Header -->
                            <div class="flex items-center gap-2 mb-3 pb-1 border-b border-gold-500/30">
                                <i class="fa-solid ${cat.icon} text-gold-400 text-sm"></i>
                                <h3 class="font-cinzel font-bold text-base text-gold-300 tracking-wide">${cat.title}</h3>
                                <span class="text-[10px] text-zinc-500 ml-auto">(${filteredItems.length})</span>
                            </div>

                            <!-- Category Items Grid -->
                            <div class="space-y-2.5">
                    `;

                    filteredItems.forEach(item => {
                        const qty = cart[item.id] ? cart[item.id].qty : 0;
                        const priceDisplay = item.price !== null ? `${item.price} TL` : 'Fiyat Sorunuz';

                        html += `
                            <div class="bg-zinc-900/90 border border-zinc-800 hover:border-gold-500/40 rounded-xl p-3 flex justify-between items-center gap-3 transition shadow-md">
                                <div class="flex-1 pr-1">
                                    <div class="font-bold text-sm text-gray-100 flex items-center gap-1.5">
                                        <span>${item.name}</span>
                                    </div>
                                    <p class="text-[11px] text-gray-400 mt-0.5 line-clamp-2 leading-tight">${item.desc}</p>
                                    <div class="text-xs font-black text-gold-400 font-cinzel mt-1.5">${priceDisplay}</div>
                                </div>

                                <!-- Add / Remove Quantity Buttons -->
                                <div class="flex items-center bg-zinc-950 border border-zinc-700/80 rounded-lg p-1 gap-2 shadow-inner">
                                    ${qty > 0 ? `
                                        <button onclick="updateQty('${item.id}', -1)" class="w-6 h-6 bg-zinc-800 hover:bg-zinc-700 text-gold-400 rounded flex items-center justify-center font-bold text-xs transition active:scale-90">
                                            <i class="fa-solid fa-minus"></i>
                                        </button>
                                        <span class="text-xs font-bold text-white w-4 text-center">${qty}</span>
                                    ` : ''}
                                    <button onclick="updateQty('${item.id}', 1)" class="w-6 h-6 bg-gold-500 hover:bg-gold-400 text-black rounded flex items-center justify-center font-bold text-xs transition active:scale-90">
                                        <i class="fa-solid fa-plus"></i>
                                    </button>
                                </div>
                            </div>
                        `;
                    });

                    html += `
                            </div>
                        </section>
                    `;
                }
            });

            menuContainer.innerHTML = html;

            if (!hasResults && filterText !== '') {
                noResults.classList.remove('hidden');
                menuContainer.classList.add('hidden');
            } else {
                noResults.classList.add('hidden');
                menuContainer.classList.remove('hidden');
            }
        }

        // SCROLL TO CATEGORY ON TAB CLICK
        function scrollToCategory(catId, btnElement) {
            // Update Tab styling
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = 'tab-btn whitespace-nowrap px-3.5 py-1.5 rounded-full text-xs transition flex items-center gap-1.5 bg-zinc-900 text-gray-300 hover:bg-zinc-800 border border-zinc-800';
            });
            btnElement.className = 'tab-btn whitespace-nowrap px-3.5 py-1.5 rounded-full text-xs transition flex items-center gap-1.5 bg-gold-500 text-black font-bold shadow-md';

            // Smooth Scroll
            const target = document.getElementById(catId);
            if (target) {
                target.scrollIntoView({ behavior: 'smooth' });
            }
        }

        // SEARCH FUNCTIONALITY
        function handleSearch() {
            const query = document.getElementById('searchInput').value;
            const clearBtn = document.getElementById('clearSearchBtn');
            
            if (query.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            renderMenu(query);
        }

        function clearSearch() {
            const input = document.getElementById('searchInput');
            input.value = '';
            document.getElementById('clearSearchBtn').classList.add('hidden');
            renderMenu('');
        }

        // CART QUANTITY MANAGER
        function updateQty(itemId, change) {
            // Find item from data
            let foundItem = null;
            for (const cat of menuData) {
                const item = cat.items.find(i => i.id === itemId);
                if (item) {
                    foundItem = item;
                    break;
                }
            }

            if (!foundItem) return;

            if (!cart[itemId]) {
                cart[itemId] = { item: foundItem, qty: 0 };
            }

            cart[itemId].qty += change;

            if (cart[itemId].qty <= 0) {
                delete cart[itemId];
            }

            // Refresh UI
            const searchQuery = document.getElementById('searchInput').value;
            renderMenu(searchQuery);
            updateCartBar();
            renderCartModalList();
        }

        // UPDATE FLOATING CART BAR
        function updateCartBar() {
            const cartBar = document.getElementById('cartBar');
            const cartCountBadge = document.getElementById('cartCountBadge');
            const cartTotalPrice = document.getElementById('cartTotalPrice');

            let totalCount = 0;
            let totalPrice = 0;

            Object.values(cart).forEach(entry => {
                totalCount += entry.qty;
                if (entry.item.price !== null) {
                    totalPrice += entry.item.price * entry.qty;
                }
            });

            if (totalCount > 0) {
                cartBar.classList.remove('translate-y-full');
                cartCountBadge.textContent = totalCount;
                cartTotalPrice.textContent = `${totalPrice} TL`;
                document.getElementById('modalTotalPrice').textContent = `${totalPrice} TL`;
            } else {
                cartBar.classList.add('translate-y-full');
                closeCartModal();
            }
        }

        // CART MODAL LOGIC
        function openCartModal() {
            renderCartModalList();
            const modal = document.getElementById('cartModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeCartModal() {
            const modal = document.getElementById('cartModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function renderCartModalList() {
            const listContainer = document.getElementById('cartItemsList');
            let html = '';

            const entries = Object.values(cart);
            if (entries.length === 0) {
                listContainer.innerHTML = '<p class="text-center text-gray-500 text-xs py-6">Sepetiniz şu anda boş.</p>';
                return;
            }

            entries.forEach(entry => {
                const item = entry.item;
                const priceText = item.price !== null ? `${item.price * entry.qty} TL` : 'Fiyat Sorunuz';

                html += `
                    <div class="pt-2 first:pt-0 flex justify-between items-center gap-2">
                        <div class="flex-1">
                            <h4 class="text-xs font-bold text-gray-200">${item.name}</h4>
                            <span class="text-[11px] text-gold-400 font-cinzel font-bold">${priceText}</span>
                        </div>

                        <div class="flex items-center bg-zinc-950 border border-zinc-700 rounded-lg p-1 gap-2">
                            <button onclick="updateQty('${item.id}', -1)" class="w-5 h-5 bg-zinc-800 hover:bg-zinc-700 text-gold-400 rounded flex items-center justify-center font-bold text-xs">
                                <i class="fa-solid fa-minus text-[9px]"></i>
                            </button>
                            <span class="text-xs font-bold text-white w-4 text-center">${entry.qty}</span>
                            <button onclick="updateQty('${item.id}', 1)" class="w-5 h-5 bg-gold-500 hover:bg-gold-400 text-black rounded flex items-center justify-center font-bold text-xs">
                                <i class="fa-solid fa-plus text-[9px]"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            listContainer.innerHTML = html;
        }

        // PHONE MODAL LOGIC
        function togglePhoneModal() {
            const modal = document.getElementById('phoneModal');
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            } else {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        // WHATSAPP ORDER GENERATOR
        function sendOrderViaWhatsApp() {
            const entries = Object.values(cart);
            if (entries.length === 0) {
                alert("Lütfen önce menüden sipariş vermek istediğiniz ürünleri ekleyin.");
                return;
            }

            let message = "Merhaba Antepli Ali Ekber Usta Kebapçı,%0A%0A*Sipariş Detaylarım:*%0A";
            let grandTotal = 0;

            entries.forEach(entry => {
                const priceCalc = entry.item.price !== null ? `${entry.item.price * entry.qty} TL` : 'Fiyat Sorunuz';
                message += `• ${entry.qty} x ${entry.item.name} (${priceCalc})%0A`;
                if (entry.item.price !== null) {
                    grandTotal += entry.item.price * entry.qty;
                }
            });

            message += `%0A*Tahmini Toplam:* ${grandTotal} TL%0A%0AAdres ve Teslimat Bilgilerim:`;

            // WhatsApp link to 0505 193 77 27
            const whatsappUrl = `https://wa.me/905051937727?text=${message}`;
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
